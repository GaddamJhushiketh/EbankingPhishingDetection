{% extends "base.html" %}

{% block content %}
<section class="hero">
    <p class="eyebrow">Final-year engineering project</p>
    <h1>E-Banking Phishing Detection</h1>
    <p>
        A modular Flask foundation for detecting phishing websites using
        associative classification.
    </p>
    <form method="post" action="{{ url_for('main.predict') }}">
        <label for="url">Website URL</label>
        <input id="url" name="url" type="url" placeholder="https://example.com" required maxlength="2048">
        <button type="submit">Analyze URL</button>
    </form>
    <p><a href="{{ url_for('main.predict_features') }}">Dataset Feature Vector Test</a></p>
</section>
{% endblock %}
